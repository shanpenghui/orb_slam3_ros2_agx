%YAML:1.0

#--------------------------------------------------------------------------------------------
# MIRA2 D435i Stereo-Inertial configuration (from live /cam_head/d435i topics)
# Source snapshot: 2026-03-28, 848x480@60, imu@200
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "Rectified"

# Rectified Camera calibration (OpenCV) from /cam_head/d435i/infra1/camera_info
Camera1.fx: 432.34759521484375
Camera1.fy: 432.34759521484375
Camera1.cx: 422.7253723144531
Camera1.cy: 238.00697326660156

# Baseline from right P[3] = -fx * b, using infra2/camera_info
Stereo.b: 0.04993909750716124

# Camera resolution
Camera.width: 848
Camera.height: 480

# Camera frames per second 
Camera.fps: 60

# Color order of the images (0: BGR, 1: RGB. Ignored for mono)
Camera.RGB: 1

# Close/Far threshold. Baseline times.
Stereo.ThDepth: 40.0

# Transformation from body-frame (imu) to left camera
# realsense extrinsics depth->gyro/accel translation = [-0.00552, +0.00510, +0.01174]
# Following ORB-SLAM3 RealSense convention, use IMU->cam_left ≈ [-0.00552, -0.00510, +0.01174].
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [1.0, 0.0, 0.0, -0.00552,
          0.0, 1.0, 0.0, -0.00510,
          0.0, 0.0, 1.0, 0.01174,
          0.0, 0.0, 0.0, 1.0]

# Do not insert KFs when recently lost
IMU.InsertKFsWhenLost: 0

# IMU noise (initial; should be refined via Allan calibration)
IMU.NoiseGyro: 1e-3
IMU.NoiseAcc: 1e-2
IMU.GyroWalk: 1e-6
IMU.AccWalk: 1e-4
IMU.Frequency: 200.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1600
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
